name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is not in the tool cache on ubuntu-latest any more
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every module
        run: python -m compileall -q mockedi tests examples tools
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  docs:
    name: documentation covers every file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog check compares against the base of the pull request,
          # so it needs more than the tip commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py
      - name: The changelog is well formed and has lost nothing
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          python tools/check_changelog.py ${BASE:+--base "$BASE"} --labels "$LABELS"

  smoke:
    name: documented examples still work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the documented curl tour and the example client
        run: |
          set -eu
          python -m mockedi --port 8080 -q &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/_mock/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8080/_mock/health
          bash examples/demo.sh
          curl -sf -X POST http://127.0.0.1:8080/_mock/reset >/dev/null
          python examples/client.py

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel and run the console script
        run: |
          set -eu
          python -m pip install dist/*.whl
          # __version__ is derived from the installed metadata: prove it matches
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$(mock-edi --version)" = "mock-edi $VERSION"
          test "$(cd /tmp && python -c 'import mockedi; print(mockedi.__version__)')" = "$VERSION"
          mock-edi --port 8081 -q &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8081/_mock/health && break
            sleep 0.25
          done
          curl -sf "http://127.0.0.1:8081/_mock/dictionary/X12/850" | head -c 200
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mock-edi:ci .
      - name: Run it and send it an order
        run: |
          set -eu
          docker run -d --name mock-edi -p 8080:8080 mock-edi:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/_mock/health >/dev/null && break
            sleep 0.5
          done
          printf 'ISA*00*          *00*          *ZZ*ACME           *ZZ*MOCKEDI        *260924*1030*U*00401*000000401*0*T*>~GS*PO*ACME*MOCKEDI*20260924*1030*401*X*004010~ST*850*0001~BEG*00*SA*PO-DOCKER**20260924~PO1*1*10*EA*12.50**VP*WIDGET-001~CTT*1~SE*5*0001~GE*1*401~IEA*1*000000401~' > order.edi
          curl -sf -X POST --data-binary @order.edi http://127.0.0.1:8080/edi
          curl -sf "http://127.0.0.1:8080/_mock/orders/PO-DOCKER"
          docker rm -f mock-edi
