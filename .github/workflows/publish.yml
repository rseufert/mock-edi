name: Publish

# Releases are published to PyPI with Trusted Publishing (OIDC): no API
# token is stored anywhere. PyPI is configured to trust this repository's
# `publish.yml` workflow running in the `pypi` environment.
#
#   PyPI    - published automatically when a GitHub Release is published
#   TestPyPI - run this workflow manually to rehearse a release first

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite before releasing anything
        run: python -m unittest discover -s tests -v
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The tag, pyproject.toml and the built package must agree
        run: |
          set -eu
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m pip install dist/*.whl
          BUILT=$(cd /tmp && python -c "import mockedi; print(mockedi.__version__)")
          echo "pyproject=$VERSION built=$BUILT tag=${GITHUB_REF_NAME#v}"
          test "$BUILT" = "$VERSION"
          if [ "${{ github.event_name }}" = "release" ]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mock-edi
    permissions:
      id-token: write        # the OIDC token that stands in for an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mock-edi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
